[package]
name = "blossom"
version = "2.0.0-pre-release"
edition = "2024"
description = "Blossom consensus protocol core, node runtime, simulator, and observer."
license = "MIT"
repository = "https://github.com/eden-dev-inc/blossom"
homepage = "https://github.com/eden-dev-inc/blossom"
documentation = "https://docs.rs/blossom"

[features]
default = ["fair-block-ordering"]
availability-gossip = ["filtered-transactions"]
external-transaction-hashes = []
fair-block-ordering = []
filtered-transactions = []
high-availability = []
insecure-fast-hash = ["dep:xxhash-rust"]
propagation-adaptive = [
    "propagation-push",
    "propagation-inventory",
    "blossom-propagation/adaptive",
]
propagation-inventory = [
    "dep:blossom-propagation",
    "blossom-propagation/bandwidth-inventory",
]
propagation-push = ["dep:blossom-propagation", "blossom-propagation/latency-push"]

[dependencies]
blossom-propagation = { version = "2.0.0-pre-release", path = "crates/blossom-propagation", optional = true }
borsh = { version = "1.5.7", features = ["derive"] }
bytes = "1.11.1"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2.0", features = ["batch", "hazmat", "rand_core"] }
fast-telemetry = { version = "0.5.1", default-features = false }
hex = { version = "0.4.3", features = ["serde"] }
hmac = "=0.12.1"
indextreemap = "0.2.0"
itoa = "1.0.15"
log = "0.4.28"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rs_merkle = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "1.0.69"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"], optional = true }

[dev-dependencies]
criterion = "0.7.0"
env_logger = "0.11.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[[bench]]
name = "protocol"
harness = false

[workspace]
members = [
    ".",
    "crates/blossom-observer",
    "crates/blossom-propagation",
    "crates/blossom-sim",
    "crates/deterministic-test-env",
]
resolver = "3"
