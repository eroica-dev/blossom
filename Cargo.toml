[package]
name = "blossom"
version = "0.2.0"
edition = "2024"
description = "Extracted Blossom consensus protocol logic from Eden."
license = "UNLICENSED"

[features]
default = []
insecure-fast-hash = ["dep:xxhash-rust"]

[dependencies]
borsh = { version = "1.5.7", features = ["derive"] }
bytes = "1.11.1"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2.0", features = ["batch", "hazmat", "rand_core"] }
hex = { version = "0.4.3", features = ["serde"] }
indextreemap = "0.2.0"
log = "0.4.28"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rs_merkle = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "1.0.69"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"], optional = true }

[dev-dependencies]
criterion = "0.7.0"
env_logger = "0.11.8"

[[bench]]
name = "protocol"
harness = false
