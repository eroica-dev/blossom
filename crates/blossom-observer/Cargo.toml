[package]
name = "blossom-observer"
version = "2.0.0"
publish = false
edition = "2024"
rust-version = "1.93"
description = "Telemetry collector and analyzer for distributed Blossom protocol runs."
license = "MIT"
repository = "https://github.com/d-tietjen/blossom"
homepage = "https://github.com/d-tietjen/blossom"
documentation = "https://docs.rs/blossom-observer"
readme = "README.md"
keywords = ["consensus", "distributed-systems", "observability", "telemetry"]
categories = ["command-line-utilities", "development-tools::profiling"]

[dependencies]
blossom = { package = "blossom-consensus", version = "2.0.0", path = "../.." }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
