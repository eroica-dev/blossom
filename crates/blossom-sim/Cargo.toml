[package]
name = "blossom-sim"
version = "2.0.0-pre-release"
edition = "2024"
description = "Deterministic Blossom simulation environment for benchmarks, chaos, and fault injection."
license = "MIT"
repository = "https://github.com/eden-dev-inc/blossom"
homepage = "https://github.com/eden-dev-inc/blossom"
documentation = "https://docs.rs/blossom-sim"

[features]
default = ["fair-block-ordering"]
availability-gossip = ["blossom/availability-gossip"]
external-transaction-hashes = ["blossom/external-transaction-hashes"]
fair-block-ordering = ["blossom/fair-block-ordering"]
filtered-transactions = ["blossom/filtered-transactions"]
high-availability = ["blossom/high-availability"]
insecure-fast-hash = ["blossom/insecure-fast-hash"]
telemetry = ["blossom/telemetry", "dep:fast-telemetry"]
eden-logger = ["blossom/eden-logger", "dep:eden_logger"]
observability = ["telemetry", "eden-logger"]
parallel-networks = ["blossom/parallel-networks", "high-availability", "trusted-checkpoint-dag"]
propagation-adaptive = ["blossom/propagation-adaptive"]
propagation-inventory = ["blossom/propagation-inventory"]
propagation-push = ["blossom/propagation-push"]
trusted-checkpoint-dag = ["blossom/trusted-checkpoint-dag"]

[dependencies]
blossom = { version = "2.0.0-pre-release", path = "../..", default-features = false }
deterministic-test-env = { version = "2.0.0-pre-release", path = "../deterministic-test-env" }
deterministic-sim-engine = { git = "https://github.com/eden-dev-inc/deterministic-simulation.git", rev = "bd1c4ba7eff99a5f324a5434b1a9d23444e32582" }
clap = { version = "4.5", features = ["derive", "env"] }
eden_logger = { version = "=0.1.2", default-features = false, features = ["log-info", "log-warn", "log-error", "log-internal", "fast-telemetry-context"], optional = true }
fast-telemetry = { version = "=0.9.0", default-features = false, features = ["runtime"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "time"] }

[[bin]]
name = "blossom-sim-ha-chaos"
path = "src/bin/blossom-sim-ha-chaos.rs"
required-features = ["high-availability"]

[[bin]]
name = "blossom-deterministic-campaign"
path = "src/bin/blossom-deterministic-campaign.rs"
required-features = ["high-availability", "trusted-checkpoint-dag"]

[[bin]]
name = "blossom-deterministic-adapter"
path = "src/bin/blossom-deterministic-adapter.rs"
required-features = ["parallel-networks"]
