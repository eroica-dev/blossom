[package]
name = "deterministic-test-env"
version = "2.0.0-pre-release"
edition = "2024"
description = "Generic deterministic testing environment primitives for protocol, system, and hardware fault harnesses."
license = "MIT"
repository = "https://github.com/eden-dev-inc/blossom"
homepage = "https://github.com/eden-dev-inc/blossom"
documentation = "https://docs.rs/deterministic-test-env"

[dependencies]
deterministic-sim-core = { git = "https://github.com/eden-dev-inc/deterministic-simulation.git", rev = "bd1c4ba7eff99a5f324a5434b1a9d23444e32582" }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48", features = ["macros", "rt", "time"] }
