name: Deterministic Protocol Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deterministic-protocol-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-pr:
    name: Deterministic HA and trusted Blossom gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure deterministic-simulation access
        uses: ./.github/actions/setup-deterministic-simulation
        with:
          deploy-key: ${{ secrets.DETERMINISTIC_SIM_DEPLOY_KEY }}

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy,rustfmt

      - name: Cache Cargo build outputs
        uses: Swatinem/rust-cache@v2

      - name: Run deterministic PR gate
        run: ./scripts/deterministic-pr-gate.sh

      - name: Publish deterministic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-pr-${{ github.run_id }}
          path: target/deterministic-sandbox/pr
          if-no-files-found: error
          retention-days: 30
